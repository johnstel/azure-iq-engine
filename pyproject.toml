[project]
name = "azure-iq-engine"
version = "0.1.0"
description = "Unified knowledge engine for Microsoft IQ layers (Work IQ, Fabric IQ, Foundry IQ)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
