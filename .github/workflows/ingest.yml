name: Content Ingestion

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to ingest (comma-separated: mslearn,youtube,azure_updates,techcommunity,azure411 or "all")'
        required: true
        default: 'all'
        type: string
      max_pages:
        description: 'Max pages per source'
        required: false
        default: '50'
        type: string
      force_recrawl:
        description: 'Force re-crawl (ignore checkpoints)'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run (crawl + chunk, no index writes)'
        required: false
        default: 'false'
        type: boolean

env:
  ACR_NAME: acriqengine01
  IMAGE: acriqengine01.azurecr.io/iq-engine:latest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Run ingestion pipeline
        run: |
          ARGS="--sources ${{ github.event.inputs.sources }}"
          ARGS="$ARGS --max-pages ${{ github.event.inputs.max_pages }}"
          if [ "${{ github.event.inputs.force_recrawl }}" = "true" ]; then
            ARGS="$ARGS --force-recrawl"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "🔄 Running: python -m src.ingestion.orchestrator $ARGS"
          echo ""

          docker run --rm \
            -e SEARCH_ENDPOINT="${{ secrets.SEARCH_ENDPOINT }}" \
            -e SEARCH_API_KEY="${{ secrets.SEARCH_API_KEY }}" \
            -e FOUNDRY_BASE_URL="${{ secrets.FOUNDRY_BASE_URL }}" \
            -e FOUNDRY_KEY="${{ secrets.FOUNDRY_KEY }}" \
            -e YOUTUBE_API_KEY="${{ secrets.YOUTUBE_API_KEY }}" \
            -e BING_API_KEY="${{ secrets.BING_API_KEY }}" \
            ${{ env.IMAGE }} \
            python -m src.ingestion.orchestrator $ARGS 2>&1 | tee /tmp/ingest-output.txt

      - name: Parse results
        if: always()
        run: |
          echo "## 📦 Ingestion Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -25 /tmp/ingest-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sources:** ${{ github.event.inputs.sources }}" >> $GITHUB_STEP_SUMMARY
          echo "**Max pages:** ${{ github.event.inputs.max_pages }}" >> $GITHUB_STEP_SUMMARY
          echo "**Force recrawl:** ${{ github.event.inputs.force_recrawl }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
