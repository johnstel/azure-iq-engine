name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # Required for OIDC federation

env:
  PYTHON_VERSION: "3.12"
  CONTAINER_APP_NAME: azure-iq-engine
  RESOURCE_GROUP: azure-iq-engine-rg

jobs:
  # ── CI: lint + test ──────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          find src -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Lint (ruff)
        run: ruff check src/

      - name: Run tests
        run: |
          if pytest --collect-only -q 2>&1 | grep -qE "^(no tests ran|0 items)"; then
            echo "No tests found — skipping pytest"
          else
            pytest tests/
          fi

  # ── CD: build + deploy (main branch only) ───────────────────────────────────
  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image via ACR Tasks
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "azure-iq-engine:${{ github.sha }}" \
            --image "azure-iq-engine:latest" \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/azure-iq-engine:${{ github.sha }}"

      - name: Health check
        run: |
          APP_URL=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          if [ -z "$APP_URL" ]; then
            echo "ERROR: Could not retrieve Container App FQDN"
            exit 1
          fi

          echo "Health check: https://${APP_URL}/health"
          echo "Waiting 30s for container to initialise..."
          sleep 30

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_URL}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i}: HTTP ${STATUS} — retrying in 15s..."
            sleep 15
          done

          echo "Health check failed after 10 attempts"
          exit 1
